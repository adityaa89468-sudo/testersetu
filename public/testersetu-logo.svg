<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" fill="none">
  <defs>
    <linearGradient id="logoBridgeGrad" x1="10" y1="40" x2="130" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="logoCheckGrad" x1="40" y1="100" x2="120" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <radialGradient id="logoSphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </radialGradient>
  </defs>

  <!-- ICON PORTION -->
  <g transform="translate(10, 10) scale(0.75)">
    <!-- Support Lattice Pillars -->
    <path d="M 62 110 L 62 132 M 82 100 L 82 136 M 100 94 L 100 138 M 118 100 L 118 136 M 138 110 L 138 132" stroke="url(#logoBridgeGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />
    <!-- Lower Rail Arch -->
    <path d="M 32 136 Q 100 86 168 136" stroke="url(#logoBridgeGrad)" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Main Arch Bridge Deck -->
    <path d="M 24 146 Q 100 74 176 146" stroke="url(#logoBridgeGrad)" stroke-width="11" stroke-linecap="round" fill="none" />
    <!-- Left Avatar -->
    <circle cx="52" cy="108" r="17" fill="url(#logoSphereGrad)" />
    <circle cx="47" cy="103" r="5" fill="#FFFFFF" opacity="0.5" />
    <!-- Center Avatar -->
    <circle cx="100" cy="86" r="21" fill="url(#logoSphereGrad)" />
    <circle cx="93" cy="79" r="7" fill="#FFFFFF" opacity="0.55" />
    <!-- Right Avatar -->
    <circle cx="148" cy="108" r="17" fill="url(#logoSphereGrad)" />
    <circle cx="143" cy="103" r="5" fill="#FFFFFF" opacity="0.5" />
    <!-- Checkmark -->
    <path d="M 68 130 L 96 156 L 158 90" stroke="url(#logoCheckGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- TEXT PORTION -->
  <text x="165" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="54" letter-spacing="-1">
    <tspan fill="#0F3899">Tester</tspan><tspan fill="#00A8EC">Setu</tspan>
  </text>
  <text x="168" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#0284C7" letter-spacing="3.5">
    MUTUAL CLOSED TESTING
  </text>
</svg>
