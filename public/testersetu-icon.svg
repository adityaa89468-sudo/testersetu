<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bridgeGrad" x1="20" y1="60" x2="180" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="checkGrad" x1="60" y1="130" x2="160" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </radialGradient>
  </defs>

  <!-- Support Lattice Pillars -->
  <path d="M 62 110 L 62 132 M 82 100 L 82 136 M 100 94 L 100 138 M 118 100 L 118 136 M 138 110 L 138 132" stroke="url(#bridgeGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />

  <!-- Lower Rail Arch -->
  <path d="M 32 136 Q 100 86 168 136" stroke="url(#bridgeGrad)" stroke-width="7" stroke-linecap="round" fill="none" />
  
  <!-- Main Arch Bridge Deck -->
  <path d="M 24 146 Q 100 74 176 146" stroke="url(#bridgeGrad)" stroke-width="11" stroke-linecap="round" fill="none" />

  <!-- 3 Tester Avatars (Spheres on Bridge) -->
  <!-- Left Avatar -->
  <g>
    <circle cx="52" cy="108" r="17" fill="url(#sphereGrad)" />
    <circle cx="47" cy="103" r="5" fill="#FFFFFF" opacity="0.5" />
  </g>

  <!-- Center Avatar -->
  <g>
    <circle cx="100" cy="86" r="21" fill="url(#sphereGrad)" />
    <circle cx="93" cy="79" r="7" fill="#FFFFFF" opacity="0.55" />
  </g>

  <!-- Right Avatar -->
  <g>
    <circle cx="148" cy="108" r="17" fill="url(#sphereGrad)" />
    <circle cx="143" cy="103" r="5" fill="#FFFFFF" opacity="0.5" />
  </g>

  <!-- Bold Dynamic Cyan Checkmark -->
  <path d="M 68 130 L 96 156 L 158 90" stroke="url(#checkGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
